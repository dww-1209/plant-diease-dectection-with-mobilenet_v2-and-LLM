{% extends "base.html" %}
{% block title %}识别 · 植物病害识别{% endblock %}
{% block content %}
<section class="identify">
  <div class="card">
    <h2>上传图片</h2>
    <form id="upload-form">
      <input type="file" id="image-input" name="image" accept="image/*" hidden />
      <div class="dropzone" id="dropzone" role="button" tabindex="0">
        <span class="dropzone-hint" id="dropzone-hint">点击选择 / 拖拽图片到这里</span>
        <img id="preview" alt="预览图" />
      </div>
      <button type="submit" class="btn" id="submit-btn">识别</button>
    </form>
  </div>

  <details class="card llm-settings" id="llm-settings">
    <summary>LLM 设置（可选）</summary>
    <p class="hint">不填则用服务器环境变量配置的 provider；填了则按本次请求覆盖，key 仅保存在本浏览器（sessionStorage），不会落到服务器日志。</p>
    <div class="form-grid">
      <label>提供商
        <select id="llm-provider"></select>
      </label>
      <label>API Key
        <input type="password" id="llm-api-key" autocomplete="off" placeholder="sk-... / 各家 console 拿到的 key" />
      </label>
      <label>模型
        <input type="text" id="llm-model" list="llm-model-list" placeholder="选择或手填" />
        <datalist id="llm-model-list"></datalist>
      </label>
    </div>
  </details>

  <div class="card" id="result-card" hidden>
    <h2>识别结果</h2>
    <dl class="result">
      <dt>植物种类</dt><dd id="r-plant"></dd>
      <dt>健康状况</dt><dd id="r-health"></dd>
      <dt>病害名称</dt><dd id="r-disease"></dd>
      <dt>患病程度</dt><dd id="r-degree"></dd>
      <dt>置信度</dt><dd id="r-prob"></dd>
    </dl>
    <button id="advice-btn" class="btn secondary">获取治理建议</button>
  </div>

  <div class="card" id="advice-card" hidden>
    <h2>治理建议</h2>
    <pre id="advice-text"></pre>
  </div>

  <div class="error" id="error-box" hidden></div>
</section>
<script src="{{ url_for('static', filename='js/identify.js') }}"></script>
{% endblock %}
